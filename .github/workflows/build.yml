name: Build Standalone Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.panicbutton.app",
            "appName": "Panic Button",
            "webDir": "www"
          }
          EOF
          npx cap add android
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          # Force Gradle resolution strategy to resolve duplicate Kotlin stdlib classes
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panic-button-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
