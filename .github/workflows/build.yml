name: Build Standalone Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Icon Generator Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install pillow

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          mkdir -p www
          cp index.html www/
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.panicbutton.app",
            "appName": "e-Walnut",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_launcher_round",
                "iconColor": "#8B5000",
                "sound": "beep.wav"
              }
            }
          }
          EOF
          npx cap add android
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          # Inject background and alarm permissions for Android 13+
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

          # Update Android native app label strings
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">e-Walnut<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">e-Walnut<\/string>/' android/app/src/main/res/values/strings.xml

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Generate e-Walnut App Icons
        run: |
          python3 -c '
          import os
          from PIL import Image, ImageDraw, ImageFont

          img = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          draw = ImageDraw.Draw(img)

          color_e = (179, 110, 68, 255)
          color_text = (0, 0, 0, 255)

          draw.rectangle([125, 30, 180, 482], fill=color_e)
          draw.rectangle([125, 30, 370, 80], fill=color_e)
          draw.rectangle([125, 225, 355, 275], fill=color_e)
          draw.rectangle([125, 430, 380, 480], fill=color_e)

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font = ImageFont.truetype(font_path, 72)
          draw.text((275, 152), "Wal", fill=color_text, font=font, anchor="mm")
          draw.text((275, 352), "Nut", fill=color_text, font=font, anchor="mm")

          fg = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          scaled = img.resize((360, 360), Image.Resampling.LANCZOS)
          fg.paste(scaled, (76, 76), scaled)

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432)
          }

          for density, (icon_sz, fg_sz) in densities.items():
              res_dir = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(res_dir, exist_ok=True)
              img.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher.png")
              img.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher_round.png")
              fg.resize((fg_sz, fg_sz), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher_foreground.png")
          '

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: e-Walnut Latest Release
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
