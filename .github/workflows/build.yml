name: Build Standalone Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Android SDK Packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Icon Generator Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install --break-system-packages pillow

      - name: Install Capacitor Toolchain
        run: npm ci

      - name: Assemble Web Assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          # Offline font copies; the CDN <link> tags stay as the online fallback.
          python3 tools/bundle_fonts.py

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android
          python3 tools/patch_manifest.py
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Generate e-Walnut App Icons
        run: |
          python3 -c '
          import os
          from PIL import Image, ImageDraw, ImageFont

          img = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          draw = ImageDraw.Draw(img)

          color_e = (179, 110, 68, 255)
          color_text = (0, 0, 0, 255)

          draw.rectangle([125, 30, 180, 482], fill=color_e)
          draw.rectangle([125, 30, 370, 80], fill=color_e)
          draw.rectangle([125, 225, 355, 275], fill=color_e)
          draw.rectangle([125, 430, 380, 480], fill=color_e)

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font = ImageFont.truetype(font_path, 72)
          draw.text((275, 152), "Wal", fill=color_text, font=font, anchor="mm")
          draw.text((275, 352), "Nut", fill=color_text, font=font, anchor="mm")

          fg = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          scaled = img.resize((360, 360), Image.Resampling.LANCZOS)
          fg.paste(scaled, (76, 76), scaled)

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432)
          }

          for density, (icon_sz, fg_sz) in densities.items():
              res_dir = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(res_dir, exist_ok=True)
              img.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher.png")
              img.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher_round.png")
              fg.resize((fg_sz, fg_sz), Image.Resampling.LANCZOS).save(f"{res_dir}/ic_launcher_foreground.png")
          '

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-walnut-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: e-Walnut Latest Release
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
