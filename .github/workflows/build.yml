name: Build Standalone Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install --upgrade pillow

      - name: Initialize Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          npm init -y

          npm install --save-exact \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/local-notifications

          mkdir -p www
          cp index.html www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.panicbutton.app",
            "appName": "e-Walnut",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_launcher_round",
                "iconColor": "#8B5000"
              }
            }
          }
          EOF

          npx cap add android

          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i '/^[[:space:]]*<manifest[^>]*>/a\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\
              <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"

          echo "Android notification and vibration permissions inserted."

          python3 - <<'PY'
          from pathlib import Path
          import re

          strings_path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          text = strings_path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'(<string\s+name="app_name"\s*>).*?(</string>)',
              r'\1e-Walnut\2',
              text,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  'Could not find the Android string named "app_name".'
              )

          strings_path.write_text(updated, encoding="utf-8")

          print("Android app label set to e-Walnut.")
          PY

      - name: Generate e-Walnut app icons
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          img = Image.new(
              "RGBA",
              (512, 512),
              (255, 255, 255, 255)
          )

          draw = ImageDraw.Draw(img)

          color_e = (179, 110, 68, 255)
          color_text = (0, 0, 0, 255)

          draw.rectangle(
              [125, 30, 180, 482],
              fill=color_e
          )

          draw.rectangle(
              [125, 30, 370, 80],
              fill=color_e
          )

          draw.rectangle(
              [125, 225, 355, 275],
              fill=color_e
          )

          draw.rectangle(
              [125, 430, 380, 480],
              fill=color_e
          )

          font_path = (
              "/usr/share/fonts/truetype/"
              "dejavu/DejaVuSans-Bold.ttf"
          )

          font = ImageFont.truetype(font_path, 72)

          draw.text(
              (275, 152),
              "Wal",
              fill=color_text,
              font=font,
              anchor="mm"
          )

          draw.text(
              (275, 352),
              "Nut",
              fill=color_text,
              font=font,
              anchor="mm"
          )

          foreground = Image.new(
              "RGBA",
              (512, 512),
              (0, 0, 0, 0)
          )

          scaled = img.resize(
              (360, 360),
              Image.Resampling.LANCZOS
          )

          foreground.paste(scaled, (76, 76), scaled)

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432)
          }

          for density, sizes in densities.items():
              icon_size, foreground_size = sizes

              resource_dir = (
                  "android/app/src/main/res/"
                  f"mipmap-{density}"
              )

              os.makedirs(resource_dir, exist_ok=True)

              img.resize(
                  (icon_size, icon_size),
                  Image.Resampling.LANCZOS
              ).save(
                  f"{resource_dir}/ic_launcher.png"
              )

              img.resize(
                  (icon_size, icon_size),
                  Image.Resampling.LANCZOS
              ).save(
                  f"{resource_dir}/ic_launcher_round.png"
              )

              foreground.resize(
                  (foreground_size, foreground_size),
                  Image.Resampling.LANCZOS
              ).save(
                  f"{resource_dir}/ic_launcher_foreground.png"
              )
          PY

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-walnut-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: e-Walnut Latest Release
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
